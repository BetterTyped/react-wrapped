<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>react-wrapped share images</title>
    <!--
      The source of the images in apps/docs/public/og: one per section of the site, 1200 x 630.
      Rendered by og.mjs, which opens this page once per section with ?title=...&line=... and screenshots it.
      The colours are the library's default dark palette: the stage and the five levels of the year grid.
    -->
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("../../../node_modules/.pnpm/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d1117;
        color: #f0f6fc;
        font-family: "Inter Variable", system-ui, sans-serif;
      }
      .light {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 80% at 8% 0%, rgba(31, 122, 61, 0.6), transparent 70%),
          radial-gradient(50% 70% at 100% 100%, rgba(14, 68, 41, 0.75), transparent 70%);
      }
      main {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.045em;
      }
      header svg {
        width: 60px;
        height: 60px;
      }
      header b {
        color: #39d353;
        font-weight: inherit;
      }
      h1 {
        margin: 0;
        max-width: 15ch;
        font-size: 104px;
        font-weight: 650;
        letter-spacing: -0.06em;
        line-height: 0.95;
      }
      p {
        margin: 22px 0 0;
        max-width: 27ch;
        color: #9198a1;
        font-size: 32px;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      .grid {
        position: absolute;
        right: -24px;
        bottom: 56px;
        display: grid;
        grid-template-rows: repeat(7, 34px);
        grid-auto-flow: column;
        grid-auto-columns: 34px;
        gap: 8px;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%);
        mask-image: linear-gradient(90deg, transparent, #000 45%);
      }
      .grid i {
        border-radius: 9px;
      }
    </style>
  </head>
  <body>
    <div class="light"></div>
    <div class="grid" id="grid"></div>
    <main>
      <header>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="l" cx="0.2" cy="0.05" r="0.9">
              <stop offset="0" stop-color="#1f7a3d" stop-opacity="0.75" />
              <stop offset="0.6" stop-color="#1f7a3d" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="#161b22" />
          <rect width="64" height="64" rx="15" fill="url(#l)" />
          <path
            d="M11.5 21.5 21.5 44.5 32 25.5 42.5 44.5 52.5 19.5"
            fill="none"
            stroke="#39d353"
            stroke-width="6.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="52.5" cy="19.5" r="7.2" fill="#d2f26b" stroke="#161b22" stroke-width="2.6" />
        </svg>
        <span>react<b>-</b>wrapped</span>
      </header>
      <div>
        <h1 id="title"></h1>
        <p id="line"></p>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      document.getElementById("title").textContent = query.get("title") ?? "Year in review videos, in React";
      document.getElementById("line").textContent = query.get("line") ?? "";
      // A year's worth of cells, the same on every render: a little wave, so it reads as a year and not as noise.
      const levels = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"];
      const grid = document.getElementById("grid");
      const seed = [...(query.get("title") ?? "home")].reduce((sum, char) => sum + char.charCodeAt(0), 0);
      for (let cell = 0; cell < 7 * 16; cell += 1) {
        const column = Math.floor(cell / 7);
        const wave = Math.sin((column + seed) / 2.3) + Math.sin((cell * 7 + seed) % 11);
        const level = Math.max(0, Math.min(4, Math.round(1.6 + wave * 1.3 + ((cell * 37 + seed) % 5) / 4)));
        const tile = document.createElement("i");
        tile.style.background = levels[level];
        grid.append(tile);
      }
    </script>
  </body>
</html>
