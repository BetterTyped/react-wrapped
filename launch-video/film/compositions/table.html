  </div>
  <script>
    (function () {
      const year = RW.sample("ada");
      const fmt = (value) => value.toLocaleString("en-US");

      // The old way: the same twelve months as rows in a report.
      document.querySelector("#table-handle").textContent = `@${year.handle}`;
      document.querySelector("#table-rows").innerHTML = year.months
        .map(
          (month) =>
            `<tr><td>${month.label}</td><td class="num">${fmt(month.total)}</td><td class="num">${month.activeDays}</td></tr>`,
        )
        .join("");

      // The new way: the same twelve numbers as the library's bar chart, the busiest month lit.
      const peak = Math.max(...year.months.map((month) => month.total));
      const bars = RW.mountChart(document.querySelector("#table-bars"), {
        type: "bars",
        bars: year.months.map((month) => ({ label: month.label, value: month.total, peak: month.total === peak })),
        peakLabel: fmt(peak),
      });

      // The name, a letter to a span, so it can arrive a letter at a time.
      document.querySelector("#table-word").innerHTML = "react-wrapped"
        .split("")
        .map((char) => `<span${char === "-" ? ' class="dash"' : ""}>${char}</span>`)
        .join("");

      const tl = gsap.timeline({ paused: true });

      /* ---- the table ---- */
      tl.fromTo(
        "#table-card",
        { y: 50, opacity: 0, filter: "blur(10px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
        0,
      );
      tl.fromTo(
        "#table-rows tr",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out", stagger: 0.035 },
        0.15,
      );
      const first = document.querySelectorAll("#table-line-1 .word");
      tl.fromTo(
        first,
        { opacity: 0, color: "#c4ccd4" },
        { opacity: 1, color: (i, el) => (el.classList.contains("grey") ? "#59636e" : "#1f2328"), duration: 0.18, stagger: 0.09 },
        0.35,
      );
      // The line swaps on the same spot, and only the words change.
      tl.to(first, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.03 }, 2.1);
      const second = document.querySelectorAll("#table-line-2 .word");
      tl.fromTo(
        second,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", stagger: 0.09 },
        2.3,
      );

      // The numbers people care about are picked out of the report, row by row...
      const picked = document.querySelectorAll("#table-rows td:nth-child(2)");
      tl.to(picked, { backgroundColor: "#dafbe1", color: "#1a7f37", fontWeight: 700, duration: 0.2, stagger: 0.04 }, 3.0);

      /* ---- ...and the ground floods to night: the same numbers stand up as bars ---- */
      tl.to("#table-ground", { backgroundColor: "#0d1117", duration: 0.45, ease: "power2.inOut" }, 3.55);
      tl.to("#table-light", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.6);
      tl.to(
        "#table-old",
        { opacity: 0, filter: "blur(16px)", scale: 0.96, duration: 0.32, ease: "power2.in" },
        3.55,
      );
      tl.set("#table-bars", { scale: 1.63, x: 0, y: 0 }, 0);
      bars.animate(tl, 3.7);
      // The chart steps down and the name lands over it.
      tl.to("#table-bars", { scale: 1.08, x: 240, y: 330, duration: 0.75, ease: "power2.inOut" }, 5.5);

      /* ---- the mark is drawn, the name follows ---- */
      tl.fromTo(
        "#table-tile",
        { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.75, ease: "elastic.out(1, 0.6)" },
        5.65,
      );
      const stroke = document.querySelector("#table-stroke");
      const length = stroke.getTotalLength();
      tl.fromTo(
        stroke,
        { strokeDasharray: length, strokeDashoffset: length },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
        5.75,
      );
      // Out of sight until it is drawn: a dash of no length with round ends is still a dot.
      tl.fromTo(stroke, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 5.75);
      tl.fromTo(
        "#table-dot",
        { scale: 0, y: -18, transformOrigin: "50% 50%" },
        { scale: 1, y: 0, duration: 0.7, ease: "elastic.out(1, 0.45)" },
        6.15,
      );
      tl.fromTo(
        "#table-word span",
        { opacity: 0, filter: "blur(8px)", y: 14 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "expo.out", stagger: 0.032 },
        5.85,
      );
      tl.fromTo(
        "#table-tag span",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.067 },
        6.2,
      );

      /* ---- zoom through, into the code ---- */
      tl.to(
        "#table-new",
        { scale: 1.14, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power3.in" },
        7.9,
      );
      window.__timelines["table"] = tl;
    })();
  </script>
